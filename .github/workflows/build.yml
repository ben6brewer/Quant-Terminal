name: Build Executables

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:  # Manual trigger from Actions tab

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            full: true
          - os: ubuntu-latest
            full: false

    runs-on: ${{ matrix.os }}

    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests (non-UI)
        run: python -m pytest -q -p no:cacheprovider --timeout=300

      - name: Run tests (full, including UI)
        if: matrix.full
        run: python -m pytest -q -p no:cacheprovider --timeout=300 --full

  build:
    needs: test
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: QuantTerminal-macOS
          - os: windows-latest
            artifact: QuantTerminal-Windows

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install "pyinstaller>=6.0"

      - name: Install pywin32 (Windows only)
        if: runner.os == 'Windows'
        run: pip install "pywin32>=306"

      - name: Build with PyInstaller
        run: pyinstaller quant_terminal.spec --noconfirm

      - name: Create DMG (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "Quant Terminal" \
            -srcfolder "dist/Quant Terminal.app" \
            -ov -format UDZO \
            "dist/QuantTerminal-macOS.dmg"

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/QuantTerminal-macOS.dmg

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/QuantTerminal/
